# Rebuilds the locked website (docs/index.html) and publishes it (now only when started by hand, see below).
# It needs three repository secrets (Settings > Secrets and variables > Actions): SITE_URL, SITE_TOKEN and SITE_PASSWORD.
# Run it by hand any time from the Actions tab ("Rebuild website" > Run workflow), for example after changing the token or the password.
name: Rebuild website

# SWITCHED OFF (Oct 21 2026): this run locked the site with a password that did not match the one he types, and he could not log in.
# The password is back to being typed only on his own computer: rebuild with `cd server && npm run site:publish`.
# It no longer starts by itself; "Run workflow" in the Actions tab still works, but only use it after re-saving SITE_PASSWORD.
on:
  workflow_dispatch:

# one build at a time, and never cancel one halfway through a push
concurrency:
  group: site-build
  cancel-in-progress: false

permissions:
  contents: write # to commit docs/
  pages: write # to ask Pages to publish it

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check the secrets are set
        env:
          SITE_URL: ${{ secrets.SITE_URL }}
          SITE_TOKEN: ${{ secrets.SITE_TOKEN }}
          SITE_PASSWORD: ${{ secrets.SITE_PASSWORD }}
        run: |
          for name in SITE_URL SITE_TOKEN SITE_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::The repository secret $name is not set. Add it under Settings > Secrets and variables > Actions."
              exit 1
            fi
          done

      - name: Build the locked page
        env:
          SITE_URL: ${{ secrets.SITE_URL }}
          SITE_TOKEN: ${{ secrets.SITE_TOKEN }}
          SITE_PASSWORD: ${{ secrets.SITE_PASSWORD }}
        run: node site/build.mjs

      - name: Commit the new page
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- docs
          if git diff --cached --quiet -- docs; then
            echo "The page did not change."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "Rebuild website (automatic)" -- docs
          git pull --rebase origin main
          git push origin HEAD:main
          echo "changed=true" >> "$GITHUB_OUTPUT"

      # Pushes made with the built-in token do not always start a Pages build by themselves, so ask for one.
      - name: Ask GitHub Pages to publish
        if: steps.commit.outputs.changed == 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${{ github.repository }}/pages/builds"
