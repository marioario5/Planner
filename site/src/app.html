<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Planner</title>
__ICON__
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #FFF8EE; --shadow: #EDE0CC; --ink: #2D1B00; --ink-light: #5C3D1E; --brown: #4A3728; --brown-dark: #2e1a08;
    --bg: #C8B89A; --bg-dark: #A8966E; --sage: #8BAF7C; --rose: #E8A0A0; --flag: #F2C94C; --z: 1.3;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); overflow: hidden; }
  body { font-family: "Press Start 2P", ui-monospace, "Courier New", monospace; font-size: 6px; line-height: 1.8; }
  button { font: inherit; color: inherit; cursor: pointer; border-radius: 0; }
  canvas { display: block; }

  #grid { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 0; }
  #deco { position: fixed; inset: 0; z-index: 1; pointer-events: none; overflow: hidden; }
  #deco span { position: absolute; text-shadow: 1px 2px 2px rgba(0, 0, 0, 0.19); }

  /* the whole desk is drawn at one size and scaled up to the window, so everything stays in proportion */
  #desk { position: fixed; left: 0; top: 0; z-index: 2; width: calc(100vw / var(--z)); height: calc(100vh / var(--z)); transform: scale(var(--z)); transform-origin: 0 0; display: flex; flex-direction: column; }

  /* ---- header: printer, plan tabs, the "next up" ticket ---- */
  #head { flex: none; display: grid; grid-template-columns: 176px 1fr 196px; gap: 14px; align-items: end; padding: 12px 18px 0; }
  #printer { width: 160px; height: 54px; image-rendering: pixelated; margin-bottom: 4px; }
  .center { text-align: center; min-width: 0; }
  .tabs { display: flex; justify-content: center; gap: 4px; }
  .tab { background: #d6c6a4; border: 2px solid var(--ink); border-bottom: 0; padding: 9px 14px 7px; font-size: 7px; letter-spacing: 0.5px; line-height: 1.5; text-align: center; white-space: pre-line; color: var(--ink-light); }
  .tab.on { background: var(--paper); color: var(--ink); padding-bottom: 9px; margin-bottom: -2px; position: relative; z-index: 1; }
  .dateline { margin: 8px 0 2px; font-size: 7px; letter-spacing: 0.5px; color: var(--ink); }
  .verse { color: var(--ink-light); font-size: 5px; }
  .headline { margin: 4px auto 0; max-width: 520px; font-size: 6px; line-height: 1.9; color: var(--ink-light); }

  .rack { position: relative; height: 84px; }
  .rack::before { content: ""; position: absolute; left: 0; right: 0; top: 6px; height: 7px; background: linear-gradient(#cfcfcf, #8d8d8d); border: 1px solid #555; box-shadow: 0 2px 0 rgba(0, 0, 0, 0.25); }
  .ticket { position: absolute; left: 10px; right: 10px; top: 14px; transform: rotate(-2deg); transform-origin: 50% 0; background: var(--paper); border: 2px solid var(--ink); padding: 14px 8px 8px; text-align: left; box-shadow: 2px 4px 0 rgba(0, 0, 0, 0.28); transition: transform 0.15s; }
  .ticket::before { content: ""; position: absolute; left: 50%; top: -9px; width: 14px; height: 14px; margin-left: -7px; background: #b9b9b9; border: 2px solid #555; border-radius: 2px; }
  .ticket:hover { transform: rotate(0deg) translateY(2px); }
  .ticket:active { transform: rotate(0deg) translateY(4px); }
  .ticket.none { opacity: 0.65; cursor: default; }
  .ticket .lbl { font-size: 5px; letter-spacing: 1px; color: #B3261E; }
  .ticket .tm { margin-top: 4px; font-size: 5px; letter-spacing: 0.5px; }
  .ticket .tt { margin-top: 3px; font-size: 6px; line-height: 1.7; max-height: 34px; overflow: hidden; }
  .ticket .go2 { margin-top: 4px; font-size: 5px; color: var(--ink-light); }

  /* ---- the board: three trays ---- */
  #board { position: relative; flex: 1; min-height: 0; display: grid; grid-template-columns: 1.1fr 1.5fr 0.95fr; gap: 16px; padding: 12px 18px 8px; }
  .tray { position: relative; display: flex; flex-direction: column; min-height: 0; background: #6B5040; border: 3px solid var(--brown-dark); box-shadow: 3px 4px 0 rgba(0, 0, 0, 0.25); transition: outline-color 0.1s; outline: 3px dashed transparent; outline-offset: 3px; }
  .tray.drop { outline-color: var(--flag); }
  .plate { flex: none; display: flex; justify-content: space-between; align-items: center; background: var(--brown); color: var(--paper); padding: 9px 12px; font-size: 7px; letter-spacing: 1px; border-bottom: 3px solid var(--brown-dark); }
  .plate b { font-weight: normal; background: var(--paper); color: var(--ink); padding: 2px 6px; font-size: 6px; }
  .inner { flex: 1; min-height: 0; overflow-y: auto; margin: 8px; padding: 8px; background: #5a4030; box-shadow: inset 2px 2px 0 rgba(0, 0, 0, 0.35); display: flex; flex-direction: column; gap: 8px; scrollbar-width: thin; scrollbar-color: rgba(255, 248, 238, 0.3) transparent; }
  .inner::-webkit-scrollbar { width: 6px; }
  .inner::-webkit-scrollbar-thumb { background: rgba(255, 248, 238, 0.3); }
  .hole { color: rgba(255, 248, 238, 0.5); text-align: center; font-size: 6px; line-height: 2; padding: 22px 8px; white-space: pre-line; }

  /* ---- a slip of paper ---- */
  .slip { position: relative; display: flex; gap: 6px; flex: none; background: var(--paper); border: 2px solid var(--ink); border-left-width: 7px; box-shadow: 2px 3px 0 rgba(0, 0, 0, 0.32); padding: 8px 8px 8px 5px; }
  .slip { user-select: none; -webkit-user-select: none; }
  .slip.flagged { animation: pulse 1.1s ease-in-out infinite alternate; }
  @keyframes pulse { from { background: #fff1c9; } to { background: #f7dd8a; } }
  .slip.lifted { opacity: 0.3; }
  .slip.pop { animation: pop 0.25s ease-out; }
  @keyframes pop { from { transform: scale(0.96); } to { transform: scale(1); } }
  .slip.done .title { text-decoration: line-through; color: rgba(92, 61, 30, 0.6); }
  .slip.done { background: #f3ead9; }
  .ghost { position: absolute; left: 0; top: 0; z-index: 60; pointer-events: none; box-shadow: 6px 9px 0 rgba(0, 0, 0, 0.3); }
  .grip { flex: none; width: 9px; margin-top: 2px; cursor: grab; touch-action: none; background-image: radial-gradient(circle, rgba(92, 61, 30, 0.55) 1.2px, transparent 1.5px); background-size: 5px 5px; }
  .box { flex: none; width: 13px; height: 13px; margin-top: 1px; border: 2px solid var(--ink); background: var(--paper); display: flex; align-items: center; justify-content: center; font-size: 8px; line-height: 1; color: #fff; cursor: pointer; }
  .slip.done .box { background: var(--sage); border-color: var(--sage); }
  .main { flex: 1; min-width: 0; cursor: pointer; }
  .slip[data-tray="current"] .main { cursor: default; }
  .toprow { display: flex; align-items: center; gap: 6px; margin-bottom: 3px; }
  .time { font-size: 5px; letter-spacing: 0.5px; }
  .nextbadge { font-size: 5px; background: #B3261E; color: #fff; padding: 1px 4px; letter-spacing: 0.5px; }
  .title { font-size: 7px; line-height: 1.8; word-wrap: break-word; }
  .flaglabel { margin-top: 3px; font-size: 5px; line-height: 1.6; color: #8A6A00; }
  .notes { margin-top: 6px; }
  .nr { margin-top: 7px; font-size: 6px; line-height: 1.9; color: var(--ink-light); }
  .nr .lab { display: inline-block; margin-bottom: 2px; border: 1px solid; padding: 0 4px; font-size: 5px; text-transform: uppercase; letter-spacing: 0.5px; }
  .nr .txt { display: block; }
  .controls { display: flex; align-items: center; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
  .go { background: var(--paper); border: 2px solid; padding: 6px 9px; font-size: 6px; line-height: 1.2; letter-spacing: 0.5px; }
  .go.fin { color: #fff; }
  .mini { background: var(--paper); border: 2px solid var(--ink-light); padding: 5px 7px; font-size: 5px; line-height: 1.2; letter-spacing: 0.5px; color: var(--ink-light); }
  .mini.pull { background: var(--ink); border-color: var(--ink); color: var(--paper); }
  .elapsed { font-size: 5px; line-height: 1.2; color: var(--ink-light); }
  .startedtxt { margin-top: 4px; font-size: 5px; line-height: 1.6; color: rgba(92, 61, 30, 0.65); }
  .side { flex: none; display: flex; align-items: flex-start; gap: 2px; margin-right: -2px; }
  .tag { border: 1px solid; padding: 2px 4px; font-size: 5px; letter-spacing: 0.5px; text-transform: uppercase; line-height: 1.8; margin-right: 3px; }
  .flagcol { display: flex; flex-direction: column; align-items: center; }
  .flagbtn { position: relative; width: 28px; height: 28px; background: transparent; border: 0; padding: 0; touch-action: manipulation; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; }
  .flagbtn svg { position: absolute; inset: 0; width: 28px; height: 28px; }
  .flagbtn .ring { fill: none; stroke: var(--flag); stroke-width: 2; stroke-dasharray: 69.1; stroke-dashoffset: 69.1; transform: rotate(-90deg); transform-origin: 14px 14px; }
  .flagbtn.holding .ring { animation: fill 2s linear forwards; }
  @keyframes fill { to { stroke-dashoffset: 0; } }
  .flagbtn .f { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; }
  .flagbtn .f svg { position: static; width: 13px; height: 13px; fill: rgba(92, 61, 30, 0.45); }
  .flagbtn.on .f svg { fill: #D9A400; }
  .stop { width: 22px; height: 22px; margin-top: 2px; background: var(--paper); border: 2px solid var(--ink); padding: 0; display: flex; align-items: center; justify-content: center; }
  .stop i { display: block; width: 8px; height: 8px; background: var(--ink); }

  /* ---- footer: info sheets, progress, rating ---- */
  #foot { flex: none; display: grid; grid-template-columns: 1fr auto auto; gap: 8px 18px; align-items: end; padding: 2px 18px 10px; }
  .secs { display: flex; flex-wrap: wrap; gap: 6px; }
  .sec { max-width: 170px; background: var(--paper); border: 2px solid var(--ink); padding: 7px 9px; font-size: 5px; line-height: 1.4; letter-spacing: 0.5px; text-transform: uppercase; }
  .err { grid-column: 1 / -1; font-size: 6px; color: #B3261E; line-height: 1.8; }
  .prog { width: 150px; }
  .prog .ph { display: flex; justify-content: space-between; font-size: 5px; letter-spacing: 0.5px; color: var(--ink-light); margin-bottom: 5px; }
  .bars { display: flex; gap: 2px; }
  .bars i { flex: 1; height: 9px; background: var(--shadow); border: 1px solid var(--bg-dark); }
  .bars i.on { background: var(--sage); border-color: #6a9060; }
  .msg { margin-top: 5px; font-size: 5px; color: #5e8552; text-align: center; min-height: 8px; }
  .rate { text-align: center; }
  .rate h3 { margin: 0 0 6px; font-size: 5px; font-weight: normal; color: var(--ink-light); letter-spacing: 0.5px; }
  .nums { display: flex; gap: 5px; }
  .nums button { width: 22px; height: 22px; background: var(--paper); border: 2px solid var(--ink); font-size: 6px; padding: 0; }
  .nums button.on { background: var(--ink); color: var(--paper); }
  .ends { display: flex; justify-content: space-between; margin-top: 4px; font-size: 4px; color: rgba(92, 61, 30, 0.75); }
  .acts { grid-column: 3; justify-self: end; display: flex; gap: 6px; }
  .acts button { background: var(--brown); border: 2px solid var(--brown-dark); color: var(--paper); padding: 8px 10px; font-size: 5px; letter-spacing: 1px; }
  .acts button.quiet { background: transparent; border-color: rgba(74, 55, 40, 0.5); color: rgba(74, 55, 40, 0.8); }
  .hint { grid-column: 1 / 3; align-self: center; font-size: 5px; line-height: 1.8; color: rgba(92, 61, 30, 0.7); }

  /* ---- narrow windows: one column, the tray you are working in first ---- */
  #desk.narrow { overflow-y: auto; overflow-x: hidden; display: block; }
  #desk.narrow #head { grid-template-columns: 1fr; justify-items: center; align-items: center; padding-top: 10px; }
  #desk.narrow .rack { width: 220px; }
  #desk.narrow #board { display: flex; flex-direction: column; padding-bottom: 6px; }
  #desk.narrow .inner { overflow: visible; }
  #desk.narrow #tray-current { order: 1; }
  #desk.narrow #tray-todo { order: 2; }
  #desk.narrow #tray-done { order: 3; }
  #desk.narrow #foot { grid-template-columns: 1fr; padding-bottom: 28px; }

  .modal { position: fixed; inset: 0; background: rgba(0, 0, 0, 0.45); display: flex; align-items: center; justify-content: center; padding: 24px; z-index: 100; }
  .dialog { zoom: var(--z); width: 100%; max-width: 280px; max-height: 70vh; overflow: auto; background: var(--paper); border: 2px solid var(--ink); padding: 22px 22px 8px; }
  .dialog h2 { margin: 0 0 14px; font-size: 8px; font-weight: normal; line-height: 1.6; }
  .dialog p { margin: 0 0 6px; font-size: 6px; line-height: 2; }
  .check { display: flex; gap: 8px; align-items: flex-start; margin: 0 0 6px; cursor: pointer; font-size: 6px; line-height: 2; }
  .check .box { cursor: pointer; }
  .check.on span:last-child { text-decoration: line-through; color: rgba(92, 61, 30, 0.6); }
  .dialog .actions { text-align: right; margin: 10px -8px 0 0; }
  .dialog .close { background: none; border: 0; padding: 10px; font-size: 6px; }
</style>
</head>
<body>
<canvas id="grid"></canvas>
<div id="deco"></div>
<div id="desk">
  <div id="head">
    <canvas id="printer" width="320" height="108"></canvas>
    <div class="center" id="center"></div>
    <div class="rack" id="rack"></div>
  </div>
  <div id="board">
    <section class="tray" id="tray-todo" data-tray="todo"></section>
    <section class="tray" id="tray-current" data-tray="current"></section>
    <section class="tray" id="tray-done" data-tray="done"></section>
  </div>
  <div id="foot"></div>
</div>
<script>window.__CFG = __CFG__; window.__VIBES = __VIBES__;</script>
<script>
__APP_JS__
</script>
</body>
</html>
