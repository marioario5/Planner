<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Planner</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #FFF8EE; --shadow: #EDE0CC; --ink: #2D1B00; --ink-light: #5C3D1E;
    --bg: #C8B89A; --bg-dark: #A8966E; --sage: #8BAF7C; --rose: #E8A0A0; --flag: #F2C94C;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--bg); color: var(--ink); }
  body { font-family: "Press Start 2P", ui-monospace, "Courier New", monospace; font-size: 8px; line-height: 1.9; padding: 16px 12px 48px; }
  button { font: inherit; color: inherit; cursor: pointer; }
  .wrap { max-width: 460px; margin: 0 auto; }
  .top { display: flex; justify-content: space-between; align-items: center; margin: 0 2px 10px; font-size: 7px; color: var(--ink-light); }
  .top button { background: transparent; border: 2px solid var(--ink-light); padding: 6px 8px; font-size: 7px; }
  .paper { background: var(--paper); border: 2px solid var(--ink); box-shadow: 4px 4px 0 var(--bg-dark); padding: 16px 14px 18px; }
  .date { font-size: 9px; text-align: center; margin: 0 0 4px; }
  .sub { text-align: center; font-size: 6px; color: var(--ink-light); margin: 0 0 12px; }
  .headline { font-size: 8px; line-height: 2; margin: 0; }
  .dash { border: 0; border-top: 2px dashed var(--shadow); margin: 12px 0; }
  .chips { display: flex; gap: 6px; margin-bottom: 12px; }
  .chip { flex: 1; padding: 8px 0; background: var(--paper); border: 2px solid var(--ink); text-align: center; font-size: 7px; line-height: 1.6; white-space: pre-line; }
  .chip.on { background: var(--ink); color: var(--paper); }
  .sections { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }
  .sec { background: var(--paper); border: 2px solid var(--ink); padding: 7px 8px; font-size: 6px; letter-spacing: 0.5px; text-transform: uppercase; }
  .row { display: flex; align-items: flex-start; gap: 10px; padding: 7px 4px; cursor: pointer; }
  .row.flagged { animation: pulse 1.1s ease-in-out infinite alternate; }
  @keyframes pulse { from { background: rgba(242, 201, 76, 0.14); } to { background: rgba(242, 201, 76, 0.42); } }
  .box { flex: none; width: 14px; height: 14px; margin-top: 1px; border: 2px solid var(--ink); background: var(--paper); display: flex; align-items: center; justify-content: center; font-size: 9px; line-height: 1; color: #fff; }
  .row.done .box { background: var(--sage); border-color: var(--sage); }
  .body { flex: 1; min-width: 0; }
  .time { font-size: 6px; margin-bottom: 3px; letter-spacing: 0.5px; }
  .title { font-size: 8px; line-height: 1.9; word-wrap: break-word; }
  .row.done .title { text-decoration: line-through; color: rgba(92, 61, 30, 0.6); }
  .flaglabel { margin-top: 3px; font-size: 6px; color: #8A6A00; }
  .ctl { display: flex; align-items: center; gap: 8px; margin-top: 6px; }
  .go { background: var(--paper); border: 2px solid; padding: 5px 7px; font-size: 6px; letter-spacing: 0.5px; }
  .go.fin { color: #fff; }
  .startedtxt { font-size: 6px; color: var(--ink-light); }
  .how { margin-top: 4px; background: none; border: 0; padding: 0; font-size: 6px; color: var(--ink-light); text-align: left; }
  .notes { margin-top: 3px; padding-left: 6px; border-left: 2px solid; font-size: 6px; line-height: 2.1; color: var(--ink-light); white-space: pre-wrap; }
  .side { flex: none; display: flex; flex-direction: column; align-items: flex-end; gap: 6px; }
  .tag { border: 1px solid; padding: 2px 4px; font-size: 6px; letter-spacing: 0.5px; text-transform: uppercase; }
  .flagbtn { position: relative; width: 28px; height: 28px; background: transparent; border: 0; padding: 0; touch-action: manipulation; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; }
  .flagbtn svg { position: absolute; inset: 0; }
  .flagbtn .ring { fill: none; stroke: var(--flag); stroke-width: 2.5; stroke-dasharray: 69.1; stroke-dashoffset: 69.1; transform: rotate(-90deg); transform-origin: 14px 14px; }
  .flagbtn.holding .ring { animation: fill 2s linear forwards; }
  @keyframes fill { to { stroke-dashoffset: 0; } }
  .flagbtn .f { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 13px; color: rgba(92, 61, 30, 0.45); }
  .flagbtn.on .f { color: #D9A400; }
  .stop { width: 22px; height: 22px; margin-top: -2px; background: var(--paper); border: 2px solid var(--ink); padding: 0; display: flex; align-items: center; justify-content: center; }
  .stop i { display: block; width: 8px; height: 8px; background: var(--ink); }
  .empty, .hint { white-space: pre-line; }
  .empty { text-align: center; color: var(--ink-light); font-size: 7px; padding: 16px 0; }
  .progress-h { display: flex; justify-content: space-between; font-size: 6px; color: var(--ink-light); margin-bottom: 6px; }
  .bars { display: flex; gap: 3px; }
  .bars i { flex: 1; height: 10px; background: var(--shadow); border: 1px solid var(--bg-dark); }
  .bars i.on { background: var(--sage); border-color: #6a9060; }
  .msg { text-align: center; color: var(--sage); font-size: 6px; margin-top: 8px; }
  .rate { text-align: center; }
  .rate h3 { margin: 0 0 8px; font-size: 6px; font-weight: normal; color: var(--ink-light); letter-spacing: 0.5px; }
  .nums { display: flex; justify-content: center; gap: 8px; }
  .nums button { width: 28px; height: 28px; background: var(--paper); border: 2px solid var(--ink); font-size: 8px; padding: 0; }
  .nums button.on { background: var(--ink); color: var(--paper); }
  .ends { display: flex; justify-content: space-between; margin-top: 6px; font-size: 5px; color: rgba(92, 61, 30, 0.7); }
  .hint { text-align: center; margin-top: 10px; font-size: 5px; line-height: 1.9; color: rgba(92, 61, 30, 0.7); }
  .err { margin: 0 0 10px; padding: 8px; border: 2px solid #B3261E; background: #FBE9E7; color: #7A1712; font-size: 6px; line-height: 2; }
  .modal { position: fixed; inset: 0; background: rgba(45, 27, 0, 0.55); display: flex; align-items: flex-end; justify-content: center; padding: 12px; z-index: 5; }
  .sheet { width: 100%; max-width: 460px; max-height: 80vh; overflow: auto; background: var(--paper); border: 2px solid var(--ink); padding: 14px; }
  .sheet h2 { margin: 0 0 10px; font-size: 8px; font-weight: normal; text-transform: uppercase; }
  .sheet p { margin: 0 0 6px; font-size: 7px; line-height: 2.1; }
  .check { display: flex; gap: 8px; align-items: flex-start; margin: 0 0 6px; cursor: pointer; font-size: 7px; line-height: 2.1; }
  .check.on span:last-child { text-decoration: line-through; color: rgba(92, 61, 30, 0.6); }
  .sheet .close { margin-top: 10px; background: var(--ink); color: var(--paper); border: 0; padding: 8px 10px; font-size: 7px; }
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<script>window.__CFG = __CFG__;</script>
<script>
__APP_JS__
</script>
</body>
</html>
