name = "cozy-planner"
main = "src/index.ts"
compatibility_date = "2026-09-01"

[vars]
# IANA zone used when a request doesn't say which day it means.
PLANNER_TZ = "America/Los_Angeles"
# A floor for the progress site's last Calc 3 plan rewrite (Oct 19, 2026, token 2026-10-19-nov16-plan). Check marks under calc3- stamped before it belong to
# an old plan and are ignored. The server also reads the site's own reset time from its page, so a newer rewrite is picked up without touching this.
SYNC_RESET_BEFORE = "calc3-:1792454229915"

[[d1_databases]]
binding = "DB"
database_name = "cozy-planner"
# Paste the id printed by `npx wrangler d1 create cozy-planner`.
database_id = "17b6b197-f29d-4ee9-bbee-c9f11676883f"
