<style>
  :root { --paper: #FFF8EE; --shadow: #EDE0CC; --ink: #2D1B00; --ink-light: #5C3D1E; --bg: #C8B89A; --bg-dark: #A8966E; --z: 1.4; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); overflow: hidden; }
  body {
    font-family: "Press Start 2P", ui-monospace, "Courier New", monospace; font-size: 8px; line-height: 1.8;

  .caption { font-size: 7px; letter-spacing: 2px; color: rgba(74, 55, 40, 0.55); margin-bottom: 16px; }
  #printer { width: 320px; height: 108px; max-width: 100%; image-rendering: pixelated; }
  form { margin: 22px 0 0; width: 100%; max-width: 260px; }
  .field { position: relative; background: var(--paper); border: 2px solid var(--ink); box-shadow: 3px 3px 0 var(--bg-dark); }

    display: block; width: 100%; margin: 0; padding: 12px 12px; border: 0; border-radius: 0; background: transparent;

const PBKDF2_ITERATIONS = 600000;
const SALT_BYTES = 16;
const IV_BYTES = 12;

function fromBase64(b64) {
  const bin = atob(b64);
  const out = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
  return out;
}

/** The decrypted text, or null if the password is wrong (or the blob is damaged). Never throws. */
async function decryptBlob(secret, b64) {
  try {
    const raw = fromBase64(b64);
    const salt = raw.slice(0, SALT_BYTES);
    const iv = raw.slice(SALT_BYTES, SALT_BYTES + IV_BYTES);
    const data = raw.slice(SALT_BYTES + IV_BYTES);
    const material = await crypto.subtle.importKey('raw', new TextEncoder().encode(secret), 'PBKDF2', false, ['deriveKey']);
    const key = await crypto.subtle.deriveKey(
      { name: 'PBKDF2', salt, iterations: PBKDF2_ITERATIONS, hash: 'SHA-256' },
      material,
      { name: 'AES-GCM', length: 256 },
      false,
      ['decrypt'],
    );
    const plain = await crypto.subtle.decrypt({ name: 'AES-GCM', iv, tagLength: 128 }, key, data);
    return new TextDecoder().decode(plain);
  } catch {
    return null;
  }
}


function startPrinter(canvas) {
  if (!canvas || !canvas.getContext) return;
  var ctx = canvas.getContext('2d');
  var P = 4;
  var C = { darkest: '#1a0d00', dark: '#2e1a08', body: '#4A3728', base: '#6B5040', light: '#8C6B52', tan: '#b89070', slot: '#0d0600', paper: '#FFF8EE', rose: '#E8A0A0', rosehi: '#f0c0c0', rosedark: '#a06060', sage: '#8BAF7C', amber: '#D4A843', red: '#c97a7a' };
  function px(x, y, color, w, hh) { ctx.fillStyle = color; ctx.fillRect(x * P, y * P, (w || 1) * P, (hh || 1) * P); }
  function draw(phase) {
    ctx.clearRect(0, 0, 320, 108);
    px(0, 4, C.base, 80, 20);
    px(0, 0, C.light, 80, 3);
    px(0, 3, C.body, 80, 1);
    var row, col;
    for (row = 0; row < 24; row++) { px(0, row, row < 4 ? C.tan : C.light); px(79, row, C.dark); }
    for (col = 5; col < 75; col++) { px(col, 23, C.dark); px(col, 24, C.darkest); px(col, 25, C.darkest); }
    for (col = 5; col < 18; col++) { px(col, 24, C.body); px(col, 25, C.dark); px(col, 26, C.darkest); }
    for (col = 62; col < 75; col++) { px(col, 24, C.body); px(col, 25, C.dark); px(col, 26, C.darkest); }
    for (col = 24; col < 56; col++) { px(col, 20, C.slot); px(col, 21, C.paper); px(col, 22, C.dark); }
    px(23, 20, C.dark); px(56, 20, C.dark); px(23, 21, C.dark); px(56, 21, C.dark);
    var bx, by;
    for (bx = 6; bx < 13; bx++) {
      for (by = 7; by < 11; by++) {
        var shade = C.rose;
        if (bx === 6 || by === 7) shade = C.rosehi;
        if (bx === 12 || by === 10) shade = C.rosedark;
        px(bx, by, shade);
      }
    }
    for (var v = 0; v < 3; v++) {
      var vy = 7 + v * 3;
      for (col = 16; col < 26; col++) { px(col, vy, C.dark); px(col, vy + 1, C.body); }
    }
    var f = Math.floor(phase * 100);
    var greenOn = (f % 62) < 55;
    var amberOn = (f % 36) < 18;
    var lx, ly;
    for (lx = 66; lx < 68; lx++) for (ly = 7; ly < 9; ly++) px(lx, ly, greenOn ? C.sage : C.body);
    [[65, 7], [68, 7], [66, 6], [66, 9], [67, 6], [67, 9]].forEach(function (p) { px(p[0], p[1], C.dark); });
    for (lx = 69; lx < 71; lx++) for (ly = 7; ly < 9; ly++) px(lx, ly, amberOn ? C.amber : C.body);
    [[68, 7], [71, 7], [69, 6], [69, 9], [70, 6], [70, 9]].forEach(function (p) { px(p[0], p[1], C.dark); });
    for (lx = 72; lx < 74; lx++) for (ly = 7; ly < 9; ly++) px(lx, ly, C.red);
    [[71, 7], [74, 7], [72, 6], [72, 9], [73, 6], [73, 9]].forEach(function (p) { px(p[0], p[1], C.dark); });
  }
  draw(0);
  if (typeof requestAnimationFrame !== 'function') return;
  var start = performance.now();
  (function loop(t) {
    requestAnimationFrame(loop);
    draw(((t - start) % 4000) / 4000);
  })(start);
}

  function sync() { mask.textContent = new Array(input.value.length + 1).join('*'); }
  input.addEventListener('input', sync);
  var width = typeof window === 'object' ? window.innerWidth : 1000;
  if (document.documentElement) document.documentElement.style.setProperty('--z', String(Math.max(1.2, Math.min(1.6, width / 360))));
  var decos = [['☕', 0.04, 0.34, -14, 1.1], ['🌵', 0.06, 0.66, 8, 0.95], ['🕯️', 0.82, 0.28, 12, 1.0], ['🍪', 0.85, 0.62, -9, 1.05], ['📓', 0.08, 0.84, -18, 0.9], ['🌿', 0.8, 0.82, 22, 1.1], ['⭐', 0.9, 0.12, -5, 0.8], ['🍵', 0.03, 0.12, 10, 0.85]];
  var box = document.getElementById('deco');
  if (box && box.appendChild) {
    decos.forEach(function (d) {
      var s = document.createElement('span');
      s.textContent = d[0];
      s.setAttribute('style', 'left:' + d[1] * 100 + '%;top:' + d[2] * 100 + '%;font-size:' + 22 * d[4] + 'px;transform:rotate(' + d[3] + 'deg)');
      box.appendChild(s);
    });
  }
  startPrinter(document.getElementById('printer'));
  form.addEventListener('submit', function (e) {
    e.preventDefault();
    var q = input.value;
    out.textContent = '';
    if (!q || busy) return;
    busy = true;
    decryptBlob(q, blob).then(function (html) {
      busy = false;
      if (html) {
        document.open();
        document.write(html);
        document.close();
      } else {
        out.textContent = 'no results';
      }
    });
  });
})();
</script>
</body>
</html>
